<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b81d24" />
      <stop offset="40%" stop-color="#8a0c12" />
      <stop offset="100%" stop-color="#4a0004" />
    </linearGradient>

    <!-- Subtle Top Inner Gloss/Glow -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Shadow for the 3D Rounded Base -->
    <radialGradient id="bottomShadow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <!-- Drop Shadow Base Effect -->
  <rect x="5" y="10" width="90" height="84" rx="24" ry="24" fill="url(#bottomShadow)" opacity="0.5" />

  <!-- Main Rounded Button Body -->
  <rect x="6" y="6" width="88" height="84" rx="22" ry="22" fill="url(#bgGrad)" stroke="#5c0206" stroke-width="1.5" />

  <!-- Top Lighting Highlight -->
  <rect x="9" y="8" width="82" height="30" rx="16" ry="16" fill="url(#glossGrad)" />

  <!-- Scaled down 'C' symbol to increase internal margin -->
  <g transform="translate(5, 4.5) scale(0.9)">
    <!-- Stylized Letter 'C' -->
    <path d="M 68,31 
             C 62,23 51,21 43,24
             C 31,28 25,41 27,53
             C 29,66 40,75 53,73
             C 61,72 68,66 70,59
             L 81,61
             C 77,74 65,84 50,85
             C 30,86 14,71 12,51
             C 10,30 24,13 45,11
             C 57,10 70,16 77,26
             Z" 
          fill="#ffffff" 
          fill-rule="evenodd" />
  </g>
</svg>
